plugins {
	id 'java'
}

group = 'br.com.jadson'
version = '3.0'

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
	options.release = 21
	options.encoding = 'UTF-8'
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {

	// rest template (deprecated methods) and @HttpExchange + RestClient (new methods)
	implementation group: 'org.springframework', name: 'spring-web', version: '6.2.11'
	implementation group: 'org.springframework', name: 'spring-context', version:'6.2.11'

	// json processing
	implementation group: 'com.fasterxml.jackson.core', name: 'jackson-core', version: '2.18.4'
	implementation group: 'com.fasterxml.jackson.core', name: 'jackson-annotations', version: '2.18.4'
	implementation group: 'com.fasterxml.jackson.core', name: 'jackson-databind', version: '2.18.4'

	// file manipulation
	implementation 'commons-io:commons-io:2.6'

	// jsoup is a Java library for working with real-world HTML.
	implementation group: 'org.jsoup', name: 'jsoup', version: '1.13.1'

    compileOnly 'org.projectlombok:lombok:1.18.42'
    annotationProcessor 'org.projectlombok:lombok:1.18.42'
	// This is a GraphQL Java implementation
	implementation 'com.graphql-java:graphql-java:14.0'

	// git libraty for java
	implementation('org.eclipse.jgit:org.eclipse.jgit:3.3.2.201404171909-r')

	// A Java library for zip files and streams
	implementation group: 'net.lingala.zip4j', name: 'zip4j', version: '2.4.0'

	// junit 5
	testImplementation platform('org.junit:junit-bom:5.11.4')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// MockRestServiceServer for the @HttpExchange clients
	testImplementation group: 'org.springframework', name: 'spring-test', version: '6.2.11'

}

test {
	useJUnitPlatform()
}
